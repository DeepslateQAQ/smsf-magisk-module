name: Bump version and build nightly

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  bump-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y zip unzip python3 shellcheck

      - name: Bump version
        run: ./build.sh bump "${{ inputs.bump }}"

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add payload/module.prop update.json
          git commit -m "chore: :bookmark: bump version to $(sed -n 's/^version=//p' payload/module.prop)"
          version=$(sed -n 's/^version=//p' payload/module.prop)
          git tag "$version"
          git push origin HEAD:main "refs/tags/$version"

      - name: Build module ZIP
        run: ./build.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: smsf-webhook-module
          path: payload/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: smsf-webhook-dist
          path: dist/*.zip
          if-no-files-found: error
