# smsfw configuration. Values are read as literal KEY=VALUE pairs.
# Prefer editing through: smsfw set <key> <value>
# --- forwarding -------------------------------------------------------------
SMSFW_ENABLED=1
SMSFW_WEBHOOK_URL=''
SMSFW_METHOD='POST'
SMSFW_TEMPLATE_FILE='/data/adb/smsf/template.json'
SMSFW_HEADERS_FILE='/data/adb/smsf/headers.txt'
SMSFW_SECRET_FILE='/data/adb/smsf/secret'
SMSFW_RESPONSE_MATCH=''
SMSFW_TLS_INSECURE=0

# --- identity ---------------------------------------------------------------
# Empty device name -> "<brand> <model>" from getprop
SMSFW_DEVICE_NAME=''
SMSFW_RULE_TITLE='sms'

# --- polling / reliability --------------------------------------------------
SMSFW_POLL_INTERVAL=5
# Safety net: query the provider at least this often even when the telephony
# database file looks unchanged (0 = always query on every poll tick).
SMSFW_DB_FULL_CHECK_INTERVAL=60
SMSFW_TIMEOUT=15
SMSFW_RETRIES=2
SMSFW_RETRY_DELAY=5
SMSFW_MAX_ATTEMPTS=100
SMSFW_QUEUE_LIMIT=200
SMSFW_FORWARD_EXISTING=0

# --- filters (extended regex, unanchored; use ^...$ to anchor) --------------
SMSFW_FILTER_SENDER_ALLOW=''
SMSFW_FILTER_SENDER_BLOCK=''
SMSFW_FILTER_BODY_ALLOW=''
SMSFW_FILTER_BODY_BLOCK=''

# --- diagnostics ------------------------------------------------------------
SMSFW_LOG_LEVEL='info'
